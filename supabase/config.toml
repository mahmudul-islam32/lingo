# Supabase CLI configuration for the LOCAL stack only (`supabase start`).
# No hosted project is linked yet (ADR-003). Secrets come from env(), never from this file.
project_id = "polyglow"

[api]
enabled = true
port = 54321
# Only `public` is exposed through PostgREST; every table there has RLS (ADR-003).
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Leaderboards (Phase 2) will use Realtime; nothing subscribes in MVP.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# Local email testing UI (sign-up confirmation, password reset).
enabled = true
port = 54324

[storage]
# Audio and content are bundled with the app; Storage is unused in MVP.
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only: skip email confirmation so dev sign-up is instant.
enable_confirmations = false
max_frequency = "1s"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
